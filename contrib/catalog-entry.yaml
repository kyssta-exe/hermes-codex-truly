description: "Gives ChatGPT/Codex-subscription models the context window the backend actually accepts instead of the one its catalog advertises. Measured live on 2026-10-14: gpt-6.1-sol advertises 500K, caps at 872K and accepts 919,956 input tokens, while the -900k opt-in variant had silently stopped working because Hermes only bumps a legacy 272K advertisement. The plugin reads the live catalog, writes one scoped model_overrides.<provider>.<model_id>.context_window entry per model (a documented step of context resolution, no core patch), and ships a probe that bisects the API for the true ceiling since the refusal is a late SSE event rather than an HTTP error. It also selects core's Codex-backed image provider so image_generate runs on the subscription with no OPENAI_API_KEY. Disclosure - uses the profile's Codex sign-in through Hermes's credentialed_provider_request (requires_auth: [openai-codex]); the plugin never reads auth.json or holds a token, and network calls go only to chatgpt.com. Writes are limited to scoped model_overrides entries and image_gen.provider (only when unset), through Hermes's atomic config writers; revert removes exactly what it wrote. No telemetry, no background processes, no shell commands, no self-updater. probe spends subscription quota (refused requests are free; accepted ones bill) and is never run automatically. Full 1M of input is not reachable on this route and the plugin says so: ~1.05M total context minus a 128K output reserve leaves ~920K, so it defaults to 900,000 and clamps to 918,000."
