name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install --upgrade pip ruff pytest pyyaml

      - name: Lint
        run: ruff check .

      - name: Install Hermes
        # Best effort. Without it the Hermes-driven tests skip and the pure ones
        # still run, which is a useful signal either way.
        continue-on-error: true
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

      - name: Test
        # Hermes' own interpreter is the one that can import hermes_cli and
        # agent.*, so the full suite runs there when Hermes installed.
        run: |
          PY=python
          if [ -x /usr/local/lib/hermes-agent/venv/bin/python ]; then
            PY=/usr/local/lib/hermes-agent/venv/bin/python
          fi
          echo "using $PY"
          "$PY" -m pytest tests/ -v

  validate-plugin:
    # Hermes' own admission checks: manifest, capability probe, declared
    # tools/hooks, security scan, no core override — the same set the plugin
    # catalog's CI runs on a submission.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Hermes
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

      - name: Validate
        run: hermes plugins validate .

      - name: Doctor
        run: hermes plugins doctor .
